<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}QuickFund{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="nav wrap">
    <a class="brand" href="{{ url_for('index') }}"><span>Q</span> QuickFund</a>
    <div class="nav-links"><a href="{{ url_for('track') }}">Track application</a><a class="button small" href="{{ url_for('apply') }}">Apply now</a></div>
  </nav>
  <main>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="flash {{ category }} wrap">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
  <footer class="wrap"><a class="brand muted" href="/">QuickFund</a><p>Transparent loans, thoughtful timelines.</p><span>© {{ today }} QuickFund</span></footer>
</body>
</html>
